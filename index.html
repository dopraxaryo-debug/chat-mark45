<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>بات ناشناس</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html[data-theme="dark"] {
    --card-bg: rgba(20, 30, 55, 0.55);
    --card-border: rgba(90, 160, 255, 0.25);
    --accent: #2f6fed;
    --accent-2: #00d4ff;
    --accent-pink: #00d4ff;
    --text: #eaf2ff;
    --text-dim: #7f93b8;
    --danger: #ff5470;
    --success: #2fd191;
    --glass-rgb: 30, 48, 90;
    --shadow-rgb: 0, 150, 255;
    --toast-rgb: 10, 20, 40;
    --bg-glow-1: rgba(47, 111, 237, 0.35);
    --bg-glow-2: rgba(0, 212, 255, 0.25);
    --bg-grad-1: #060812;
    --bg-grad-2: #05070d;
    --bg-grad-3: #030409;
    --logo-glow: rgba(0, 212, 255, 0.35);
    --logo-ring: rgba(20, 30, 55, 0.7);
  }

  html[data-theme="light"] {
    --card-bg: rgba(255, 255, 255, 0.5);
    --card-border: rgba(255, 255, 255, 0.75);
    --accent: #8b7cf6;
    --accent-2: #6ec3ff;
    --accent-pink: #d68bf0;
    --text: #2b2350;
    --text-dim: #6f6795;
    --danger: #ff5470;
    --success: #34c98f;
    --glass-rgb: 255, 255, 255;
    --shadow-rgb: 139, 124, 246;
    --toast-rgb: 43, 35, 80;
    --bg-glow-1: rgba(188, 220, 255, 0.7);
    --bg-glow-2: rgba(240, 198, 255, 0.7);
    --bg-grad-1: #d9d2fb;
    --bg-grad-2: #ece6fb;
    --bg-grad-3: #f3e3f9;
    --logo-glow: rgba(139, 124, 246, 0.35);
    --logo-ring: rgba(255, 255, 255, 0.55);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(circle at 12% 8%, var(--bg-glow-1) 0%, transparent 45%),
      radial-gradient(circle at 88% 82%, var(--bg-glow-2) 0%, transparent 45%),
      linear-gradient(160deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 45%, var(--bg-grad-3) 100%);
    background-attachment: fixed;
    color: var(--text);
    padding: 20px 16px 100px;
    perspective: 1200px;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    z-index: 30;
  }

  .logo-wrap {
    display: flex;
    justify-content: center;
    margin: 4px 0 10px;
  }

  .logo-wrap img {
    width: 84px;
    height: 84px;
    object-fit: cover;
    border-radius: 50%;
    box-shadow:
      0 10px 30px var(--logo-glow),
      0 0 0 6px var(--logo-ring);
    animation: floatLogo 4s ease-in-out infinite;
  }

  @keyframes floatLogo {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  h1 {
    font-size: 19px;
    text-align: center;
    margin: 0 0 24px;
    background: linear-gradient(90deg, var(--accent), var(--accent-pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }

  .tabs {
    position: fixed;
    bottom: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    gap: 6px;
    background: rgba(var(--glass-rgb), 0.55);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(var(--shadow-rgb), 0.25);
    z-index: 10;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 2px;
    border-radius: 14px;
    font-size: 12px;
    color: var(--text-dim);
    transition: all 0.25s ease;
    cursor: pointer;
  }

  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 6px 18px rgba(var(--shadow-rgb), 0.45);
  }

  .page { display: none; animation: fadeIn 0.3s ease; }
  .page.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 16px;
    backdrop-filter: blur(14px);
    box-shadow: 0 16px 40px rgba(var(--shadow-rgb), 0.25);
    transform-style: preserve-3d;
    transition: transform 0.15s ease;
    will-change: transform;
  }

  .card-title {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .link-box {
    direction: ltr;
    text-align: center;
    font-size: 14px;
    word-break: break-all;
    background: rgba(var(--glass-rgb), 0.55);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    transform: translateZ(24px);
  }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transform: translateZ(16px);
    box-shadow: 0 10px 24px rgba(var(--shadow-rgb), 0.35);
  }

  .btn:active { transform: translateZ(16px) scale(0.97); }

  .btn.secondary {
    background: rgba(var(--glass-rgb), 0.5);
    color: var(--text);
    box-shadow: none;
  }

  .btn.danger {
    background: linear-gradient(135deg, var(--danger), #ff8a5b);
  }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 30px 0;
    font-size: 14px;
  }

  .blocked-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(var(--glass-rgb), 0.45);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transform: translateZ(10px);
  }

  .blocked-item span { font-size: 14px; }

  .mini-btn {
    padding: 8px 14px;
    border: none;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: var(--success);
    cursor: pointer;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: rgba(var(--glass-rgb), 0.55);
    color: var(--text);
    padding: 14px;
    font-size: 14px;
    resize: vertical;
    margin-bottom: 14px;
    transform: translateZ(20px);
  }

  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(var(--toast-rgb), 0.92);
    border: 1px solid var(--card-border);
    color: #fff;
    padding: 10px 18px;
    border-radius: 14px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }

  .toast.show { opacity: 1; }

  .loader {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 0;
  }

  /* ---------- صندوق پیام (چت) ---------- */

  .chat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(var(--glass-rgb), 0.45);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transform: translateZ(8px);
  }

  .chat-avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    color: #fff;
  }

  .chat-info { flex: 1; min-width: 0; }

  .chat-name {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .chat-preview {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-time {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* صفحه‌ی گفتگو */
  #thread-view {
    display: none;
    flex-direction: column;
    height: calc(100vh - 160px);
  }

  #thread-view.active { display: flex; }

  .thread-header {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 12px;
    backdrop-filter: blur(14px);
  }

  .thread-header .back-btn {
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
  }

  .thread-header .thread-name {
    flex: 1;
    font-weight: 700;
    font-size: 14px;
  }

  .thread-header .icon-btn {
    font-size: 17px;
    cursor: pointer;
    padding: 4px 6px;
  }

  .thread-messages {
    flex: 1;
    overflow-y: auto;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
  }

  .bubble.incoming {
    align-self: flex-start;
    background: rgba(var(--glass-rgb), 0.6);
    border: 1px solid var(--card-border);
    border-bottom-left-radius: 4px;
  }

  .bubble.outgoing {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bubble-time {
    font-size: 10px;
    opacity: 0.7;
    margin-top: 4px;
    display: block;
  }

  .thread-input {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .thread-input input {
    flex: 1;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    background: rgba(var(--glass-rgb), 0.55);
    color: var(--text);
    padding: 12px 14px;
    font-size: 14px;
  }

  .thread-input button {
    border: none;
    border-radius: 14px;
    padding: 0 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  .thread-input .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    min-width: 42px;
    border-radius: 14px;
    background: rgba(var(--glass-rgb), 0.55);
    font-size: 18px;
    cursor: pointer;
  }

  .bubble img, .bubble video {
    max-width: 100%;
    border-radius: 12px;
    display: block;
  }

  .bubble .bubble-caption {
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="theme-toggle" id="theme-toggle">🌙</div>

<div class="logo-wrap">
  <img src="/assets/logo.jpg" alt="لوگو" />
</div>
<h1>🕶️ فضای ناشناس تو</h1>

<div id="loading" class="loader">در حال بارگذاری...</div>

<div id="app" style="display:none">

  <!-- صفحه لینک -->
  <div class="page active" id="page-link">
    <div class="card" data-tilt>
      <div class="card-title">لینک اختصاصی تو</div>
      <div class="link-box" id="link-text">—</div>
      <button class="btn" id="copy-btn">📋 کپی لینک</button>
    </div>
    <div class="card" data-tilt>
      <div class="card-title">راهنما</div>
      <p style="font-size:13px; color:var(--text-dim); line-height:1.9; margin:0;">
        این لینک رو توی چنل، بیو یا استوریت به اشتراک بذار. هرکی روش بزنه می‌تونه
        برات پیام کاملاً ناشناس بفرسته و تو می‌تونی ناشناس جوابشو بدی.
      </p>
    </div>
  </div>

  <!-- صفحه پیام‌ها (صندوق ورودی) -->
  <div class="page" id="page-chats">
    <div id="chat-list-view">
      <div id="chat-list"></div>
    </div>
    <div id="thread-view">
      <div class="thread-header">
        <span class="back-btn" id="thread-back">→</span>
        <span class="thread-name" id="thread-name">—</span>
        <span class="icon-btn" id="thread-edit" title="تغییر اسم">✏️</span>
        <span class="icon-btn" id="thread-block" title="مسدود کردن">🚫</span>
      </div>
      <div class="thread-messages" id="thread-messages"></div>
      <div class="thread-input">
        <span class="icon-btn" id="thread-attach" title="ارسال عکس/گیف">📎</span>
        <input type="file" id="thread-file-input" accept="image/*" style="display:none" />
        <input type="text" id="thread-input-box" placeholder="پیامتو بنویس..." />
        <button id="thread-send">ارسال</button>
      </div>
    </div>
  </div>

  <!-- صفحه مسدودی‌ها -->
  <div class="page" id="page-blocked">
    <div id="blocked-list"></div>
  </div>

  <!-- صفحه پشتیبانی -->
  <div class="page" id="page-support">
    <div class="card" data-tilt>
      <div class="card-title">پیام برای پشتیبانی</div>
      <textarea id="support-text" placeholder="پیامتو اینجا بنویس..."></textarea>
      <button class="btn" id="support-btn">🆘 ارسال به پشتیبانی</button>
    </div>
  </div>

</div>

<div class="tabs">
  <div class="tab active" data-page="page-link">🔗 لینک</div>
  <div class="tab" data-page="page-chats">💬 پیام‌ها</div>
  <div class="tab" data-page="page-blocked">🚫 مسدودی‌ها</div>
  <div class="tab" data-page="page-support">🆘 پشتیبانی</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  const isInsideTelegram = !!(tg && tg.initData);

  // ---------- تم ----------
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("theme-toggle").textContent = theme === "dark" ? "🌙" : "☀️";
    try {
      localStorage.setItem("anon-bot-theme", theme);
    } catch {}
  }

  function initTheme() {
    let saved = null;
    try {
      saved = localStorage.getItem("anon-bot-theme");
    } catch {}
    const fallback = tg?.colorScheme === "light" ? "light" : "dark";
    applyTheme(saved || fallback);
  }

  document.getElementById("theme-toggle").addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    applyTheme(current === "dark" ? "light" : "dark");
  });

  initTheme();

  if (tg) {
    tg.ready();
    tg.expand();
  }

  const initData = tg?.initData || "";
  let state = { link: "", blocked: [], conversations: [] };
  let currentThread = null; // anon_number مکالمه‌ی باز فعلی

  const DEV_PREVIEW = !isInsideTelegram;
  const DEV_SAMPLE = {
    ok: true,
    link: "https://t.me/YourBot?start=demo123",
    blocked: [{ anon_number: 1 }, { anon_number: 4 }],
  };
  const DEV_CONVERSATIONS = [
    { anon_number: 2, nickname: null, last_text: "سلام چطوری؟", last_time: new Date().toISOString() },
    { anon_number: 5, nickname: "همکار فوضول", last_text: "جواب بده دیگه", last_time: new Date().toISOString() },
  ];
  const DEV_MESSAGES = [
    { direction: "to_owner", text: "سلام، خوبی؟", time: new Date().toISOString() },
    { direction: "to_sender", text: "سلام مرسی، تو خوبی؟", time: new Date().toISOString() },
    { direction: "to_owner", text: "این یه پیام نمونه‌ست", time: new Date().toISOString() },
  ];

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 1800);
  }

  async function api(path, payload) {
    if (DEV_PREVIEW) {
      if (path === "/api/me") return DEV_SAMPLE;
      if (path === "/api/unblock") return { ok: true };
      if (path === "/api/block") return { ok: true };
      if (path === "/api/support") return { ok: true };
      if (path === "/api/conversations") return { ok: true, conversations: DEV_CONVERSATIONS };
      if (path === "/api/conversation") return { ok: true, messages: DEV_MESSAGES };
      if (path === "/api/nickname") return { ok: true };
      if (path === "/api/send") return { ok: true };
    }
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData, ...payload }),
    });
    return res.json();
  }

  function timeLabel(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
  }

  function displayName(conv) {
    return conv.nickname || `ناشناس #${conv.anon_number}`;
  }

  function renderBubbleContent(m) {
    if (m.file_id && (m.content_type === "photo" || m.content_type === "animation")) {
      const mediaTag =
        m.content_type === "animation"
          ? `<video src="/api/media/${m.file_id}" autoplay loop muted playsinline></video>`
          : `<img src="/api/media/${m.file_id}" />`;
      const captionHtml = m.text ? `<div class="bubble-caption">${m.text}</div>` : "";
      return mediaTag + captionHtml;
    }
    return m.text || `[${m.content_type}]`;
  }

  // ---------- مسدودی‌ها ----------

  function renderBlocked() {
    const container = document.getElementById("blocked-list");
    if (!state.blocked.length) {
      container.innerHTML = '<div class="empty">لیست مسدودی‌هات خالیه 🎉</div>';
      return;
    }
    container.innerHTML = state.blocked
      .map(
        (b) => `
        <div class="blocked-item" data-tilt>
          <span>🚫 ناشناس #${b.anon_number}</span>
          <button class="mini-btn" data-unblock="${b.anon_number}">آزاد کن</button>
        </div>`
      )
      .join("");

    container.querySelectorAll("[data-unblock]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const anonNumber = parseInt(btn.getAttribute("data-unblock"), 10);
        btn.disabled = true;
        const r = await api("/api/unblock", { anon_number: anonNumber });
        if (r.ok) {
          state.blocked = state.blocked.filter((b) => b.anon_number !== anonNumber);
          renderBlocked();
          showToast("آزاد شد ✅");
        } else {
          btn.disabled = false;
          showToast("مشکلی پیش اومد");
        }
      });
    });
  }

  // ---------- صندوق پیام (چت لیست) ----------

  async function loadConversations() {
    const r = await api("/api/conversations", {});
    if (r.ok) {
      state.conversations = r.conversations;
      renderChatList();
    }
  }

  function renderChatList() {
    const container = document.getElementById("chat-list");
    if (!state.conversations.length) {
      container.innerHTML = '<div class="empty">هنوز پیامی نداری 📭</div>';
      return;
    }
    container.innerHTML = state.conversations
      .map((c) => {
        const name = displayName(c);
        const initial = name.replace("#", "").trim().slice(-2);
        return `
        <div class="chat-item" data-open="${c.anon_number}" data-tilt>
          <div class="chat-avatar">${initial}</div>
          <div class="chat-info">
            <div class="chat-name">${name}</div>
            <div class="chat-preview">${c.last_text || ""}</div>
          </div>
          <div class="chat-time">${timeLabel(c.last_time)}</div>
        </div>`;
      })
      .join("");

    container.querySelectorAll("[data-open]").forEach((el) => {
      el.addEventListener("click", () => openThread(parseInt(el.getAttribute("data-open"), 10)));
    });
  }

  async function openThread(anonNumber) {
    currentThread = anonNumber;
    const conv = state.conversations.find((c) => c.anon_number === anonNumber);
    document.getElementById("thread-name").textContent = conv ? displayName(conv) : `ناشناس #${anonNumber}`;

    document.getElementById("chat-list-view").style.display = "none";
    document.getElementById("thread-view").classList.add("active");

    const r = await api("/api/conversation", { anon_number: anonNumber });
    const box = document.getElementById("thread-messages");
    if (!r.ok) {
      box.innerHTML = '<div class="empty">خطا در بارگذاری پیام‌ها</div>';
      return;
    }
    box.innerHTML = r.messages
      .map(
        (m) => `
        <div class="bubble ${m.direction === "to_owner" ? "incoming" : "outgoing"}">
          ${renderBubbleContent(m)}
          <span class="bubble-time">${timeLabel(m.time)}</span>
        </div>`
      )
      .join("");
    box.scrollTop = box.scrollHeight;
  }

  function closeThread() {
    currentThread = null;
    document.getElementById("thread-view").classList.remove("active");
    document.getElementById("chat-list-view").style.display = "block";
    loadConversations();
  }

  document.getElementById("thread-back").addEventListener("click", closeThread);

  document.getElementById("thread-send").addEventListener("click", async () => {
    const input = document.getElementById("thread-input-box");
    const text = input.value.trim();
    if (!text || currentThread === null) return;
    input.value = "";

    const box = document.getElementById("thread-messages");
    box.insertAdjacentHTML(
      "beforeend",
      `<div class="bubble outgoing">${text}<span class="bubble-time">${timeLabel(new Date().toISOString())}</span></div>`
    );
    box.scrollTop = box.scrollHeight;

    const r = await api("/api/send", { anon_number: currentThread, message: text });
    if (!r.ok) showToast("ارسال ناموفق بود");
  });

  document.getElementById("thread-attach").addEventListener("click", () => {
    if (currentThread === null) return;
    document.getElementById("thread-file-input").click();
  });

  document.getElementById("thread-file-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || currentThread === null) return;

    if (DEV_PREVIEW) {
      showToast("🔧 توی حالت پیش‌نمایش ارسال واقعی نمی‌شه");
      return;
    }

    const captionInput = document.getElementById("thread-input-box");
    const caption = captionInput.value.trim();
    captionInput.value = "";

    const previewUrl = URL.createObjectURL(file);
    const box = document.getElementById("thread-messages");
    const isGif = file.type === "image/gif";
    box.insertAdjacentHTML(
      "beforeend",
      `<div class="bubble outgoing">
        ${isGif ? `<video src="${previewUrl}" autoplay loop muted playsinline></video>` : `<img src="${previewUrl}" />`}
        ${caption ? `<div class="bubble-caption">${caption}</div>` : ""}
        <span class="bubble-time">${timeLabel(new Date().toISOString())}</span>
      </div>`
    );
    box.scrollTop = box.scrollHeight;

    const formData = new FormData();
    formData.append("initData", initData);
    formData.append("anon_number", currentThread);
    formData.append("caption", caption);
    formData.append("file", file);

    try {
      const res = await fetch("/api/send-media", { method: "POST", body: formData });
      const r = await res.json();
      if (!r.ok) showToast("ارسال ناموفق بود");
    } catch {
      showToast("ارسال ناموفق بود");
    }
  });

  document.getElementById("thread-edit").addEventListener("click", async () => {
    if (currentThread === null) return;
    const conv = state.conversations.find((c) => c.anon_number === currentThread);
    const current = conv?.nickname || "";
    const newName = prompt("اسم مستعار این مخاطب رو وارد کن:", current);
    if (newName === null) return;
    const r = await api("/api/nickname", { anon_number: currentThread, nickname: newName });
    if (r.ok) {
      if (conv) conv.nickname = newName || null;
      document.getElementById("thread-name").textContent = conv ? displayName(conv) : `ناشناس #${currentThread}`;
      showToast("اسم تغییر کرد ✅");
    } else {
      showToast("مشکلی پیش اومد");
    }
  });

  document.getElementById("thread-block").addEventListener("click", async () => {
    if (currentThread === null) return;
    if (!confirm("این مخاطب مسدود بشه؟")) return;
    const r = await api("/api/block", { anon_number: currentThread });
    if (r.ok) {
      showToast("مسدود شد 🚫");
      closeThread();
    } else {
      showToast("مشکلی پیش اومد");
    }
  });

  // ---------- بارگذاری اولیه ----------

  async function init() {
    if (DEV_PREVIEW) showToast("🔧 حالت پیش‌نمایش - داده‌ی نمونه");
    const r = await api("/api/me", {});
    document.getElementById("loading").style.display = "none";

    if (!r.ok) {
      document.getElementById("loading").style.display = "block";
      document.getElementById("loading").textContent =
        r.error === "banned" ? "دسترسی شما مسدود شده." : "خطا در احراز هویت.";
      return;
    }

    document.getElementById("app").style.display = "block";
    state.link = r.link;
    state.blocked = r.blocked;

    document.getElementById("link-text").textContent = state.link;
    renderBlocked();
    loadConversations();
  }

  document.getElementById("copy-btn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(state.link);
      showToast("لینک کپی شد 📋");
    } catch {
      showToast(state.link);
    }
  });

  document.getElementById("support-btn").addEventListener("click", async () => {
    const textarea = document.getElementById("support-text");
    const msg = textarea.value.trim();
    if (!msg) return;
    const r = await api("/api/support", { message: msg });
    if (r.ok) {
      textarea.value = "";
      showToast("پیامت ارسال شد 🙏");
    } else {
      showToast("مشکلی پیش اومد");
    }
  });

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.getAttribute("data-page")).classList.add("active");
      if (tab.getAttribute("data-page") === "page-chats") loadConversations();
    });
  });

  // افکت تیلت سه‌بعدی روی کارت‌ها
  function attachTilt(el) {
    el.addEventListener("pointermove", (e) => {
      const rect = el.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      el.style.transform = `rotateY(${x * 10}deg) rotateX(${-y * 10}deg)`;
    });
    el.addEventListener("pointerleave", () => {
      el.style.transform = "rotateY(0) rotateX(0)";
    });
  }

  function attachAllTilts() {
    document.querySelectorAll("[data-tilt]").forEach(attachTilt);
  }

  init();
  attachAllTilts();
  const observer = new MutationObserver(attachAllTilts);
  observer.observe(document.body, { childList: true, subtree: true });
</script>

</body>
